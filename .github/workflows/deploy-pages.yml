# ─────────────────────────────────────────────────────────────
# Deploy the StyleBakery docs site to GitHub Pages.
#
# The docs app builds the library FROM SOURCE (see vite.config.js), so this
# workflow checks out two repos: this one, and the library. It then compiles
# the static site and hands build/ to the first-party Pages deploy action —
# no gh-pages branch, no PAT for deployment.
#
# One-time setup: repo Settings → Pages → "Build and deployment" →
# Source: "GitHub Actions".
# ─────────────────────────────────────────────────────────────

name: Deploy docs to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Permissions the deploy action needs: publish Pages, mint the OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs site
        uses: actions/checkout@v4

      # The library lives in a separate repo and is built from source. Vite
      # resolves it via STYLEBAKERY_LIB + /src/lib, so check it out there.
      # Public repo: the default token is enough. If StyleBakery is private,
      # add a repo-scoped PAT as the LIB_REPO_TOKEN secret.
      - name: Checkout library source
        uses: actions/checkout@v4
        with:
          repository: stylebakery/stylebakery
          ref: master
          path: .lib/stylebakery
          token: ${{ secrets.LIB_REPO_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          # Where vite.config.js expects the library checkout.
          STYLEBAKERY_LIB: .lib/stylebakery
          # The site is served on the custom domain tellmemyip.info, which
          # serves from the root — so build WITHOUT a base path. (If you ever
          # drop the custom domain and serve from the project page at
          # <user>.github.io/<repo>/, set this to /${{ github.event.repository.name }}.)
          BASE_PATH: ''
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
